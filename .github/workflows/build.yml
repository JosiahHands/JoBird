name: Build/release

# Every push to main builds JoBird for macOS, Windows and Linux (files are
# kept as workflow artifacts). Pushing a tag like v0.8.7 also publishes a
# GitHub release with all installers attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build_package.js uses the commit count as build number

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Add python setuptools (node-gyp)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: python3 -m pip install --break-system-packages setuptools

      - name: Install rpm tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      # macOS gets one retry: dmg creation on macOS runners fails now and then
      # for transient reasons (same idea as the old max_attempts: 2 for macOS)
      - name: Build app
        shell: bash
        run: |
          attempts=1
          if [ "$RUNNER_OS" = "macOS" ]; then attempts=2; fi
          for i in $(seq 1 $attempts); do
            npm run build && exit 0
            echo "Build attempt $i failed"
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no code signing certificate

      - name: List files
        shell: bash
        run: ls -lah dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: JoBird-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: List files
        run: ls -lah installers

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: JoBird ${{ github.ref_name }}
          files: installers/*
          generate_release_notes: true
